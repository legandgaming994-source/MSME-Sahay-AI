name: Security scans

# S-5: dependency and secret scanning gates. Fails the build on known-vulnerable
# runtime dependencies or committed secrets. Python audit runs against the
# installed environment; npm audit covers production dependencies only.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-deps:
    name: pip-audit (runtime dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[msme]" pip-audit
      # Audit the installed runtime dependency set (not pip/setuptools of the runner).
      # Documented, time-boxed exceptions (see docs/msme/SECURITY_EXCEPTIONS.md):
      #   PYSEC-2026-4298  python-jose HMAC key-format confusion; no upstream fix. Mitigated:
      #                    all JWT decoders pin algorithms server-side (tests/test_oauth_alg_pinning.py).
      #   PYSEC-2026-1325  ecdsa Minerva timing attack on signing; no planned fix. Only signing is
      #                    affected and the app signs HS256 only. Pulled in transitively by python-jose.
      # Review both when migrating to PyJWT. Any NEW advisory fails this job.
      - name: Audit runtime dependencies
        run: |
          pip freeze --exclude-editable | grep -v -i -E '^(pip|setuptools|wheel|pip-audit)==' > runtime-req.txt
          pip-audit --strict --no-deps --disable-pip -r runtime-req.txt \
            --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

  node-deps:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

  static-analysis:
    name: bandit (msme/ and api/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r msme api -ll -q

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner -v
